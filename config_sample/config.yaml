# BE VERY CAREFUL ABOUT MODIFYING THIS FILE!
# YAML has a very nitpicky syntax, and even something as simple as an extra
# space can cause your server to fail to start.
# Check your config here: http://www.yamllint.com/

# Name of the server in OOC chat. It should be set to something that cannot
# be used by other players.
hostname: <dollar>H

# Max number of player slots to be made. The player limit is actually not
# enforced, but bad things are supposed to happen if this is exceeded.
playerlimit: 100

# TCP port to listen on
port: 27016

# Whether this server can only be accessed by the local machine it is
# being hosted on.
local: false

# Moderator password.
# A more complex mod password configuration:
#
# modpass:
#   mod1:
#     password: foo
#   mod2:
#     password: bar
#
# You can add, remove, or change passwords for individual mods
# The username (in this example Admin) corresponds to the OOC name
modpass:
  Admin:
    password: mod

# Password to use the /restart command
restartpass: restart

# Sent to joining players.
motd: Welcome to my server!

# Whether the server is open to webAO connections
use_websockets: true
# Port to listen on for websocket connections
websocket_port: 50001
# Optional: advertise a different ws port to the masterserver
# advertised_websocket_port: 80

# Whether the server is open to secure websocket connections
use_securewebsockets: false
# Port that is advertised to the masterserver for WSS connections (KFO-Server does not accept SSL directly)
secure_websocket_port: 443

# WebAO Asset URL for hosting files. Leave blank to use vanilla
# Also used as the GM panel's server-side fallback for resolving background/
# character-icon/evidence images (see gm_panel below) when a GM hasn't
# configured a local content source in the panel -- exposed read-only via
# GET /api/gm/assets/config.
asset_url:

# Whether the server should be advertised on the server list.
use_masterserver: true
# How the server should be listed on the server list.
masterserver_name: My First Server
masterserver_description: This is my flashy new server
# Custom IP address/hostname to use on the server list
# masterserver_custom_hostname: ao.example.com

# Timeout for dead connections (in seconds).
# To prevent issues, this value should be greater than 60.
timeout: 250

# Packet size in bytes. This is 1024 by default.
# Don't touch this if you don't know what you're doing.
packet_size: 1024

# Whether to prevent users from repeatedly posting the same message.
# If True, you will not be able to post the same message as the last one if you posted it.
block_repeat: true

# Whether global chat is enabled
global_chat: true

# If playing streamed music by URL is allowed or not
music_allow_url: true

# Can use /gethubs without being a mod
can_gethubs: true

# Enables additional logging.
debug: false

# The interval is specified in seconds
music_change_floodguard:
  times_per_interval: 3
  interval_length: 20
  mute_length: 60

wtce_floodguard:
  times_per_interval: 5
  interval_length: 10
  mute_length: 60
  
ooc_floodguard:
  times_per_interval: 5
  interval_length: 5
  mute_length: 15

ic_floodguard:
  times_per_interval: 5
  interval_length: 2
  mute_length: 7

cc_floodguard:
  times_per_interval: 5
  interval_length: 3
  mute_length: 15

# Per-IP connection rate limit.
# max_connections: max new connections from one IP within interval_length seconds.
# Set max_connections to 0 to disable. (Default: 0 = disabled)
connection_rate_limit:
  max_connections: 5
  interval_length: 5

# Global packet-per-second throttle per client.
# Set max_per_second to 0 to disable. (Default: 0 = disabled)
packet_rate_limit:
  max_per_second: 25

# Global server-wide new connections per second cap.
# Limits total new TCP connections across ALL IPs per second.
# Set max_per_second to 0 to disable. (Default: 0 = disabled)
global_connection_rate:
  max_per_second: 5

# Minimum seconds a client must be connected before they can send IC or CC.
# Mods and CMs are exempt. Helps slow connect-spam-disconnect attacks.
# Set to 0 to disable. (Default: 0 = disabled)
min_connection_age:
  before_ic: 3
  before_cc: 3

# Minimum milliseconds between /demo calls before rate limiting kicks in.
# Set to 0 or less to disable demo rate limiting entirely. (Default: 0)
demo_rate_limit_ms: 0

# Maximum number of instructions a demo script may execute before playback is
# stopped. Guards against runaway loops (e.g. an accidental `goto` that never
# exits). (Default: 1000000)
demo_max_steps: 1000000

# How many subscripts zalgo is stripped by; 3 is recommended as not to hurt special language diacritics
zalgo_tolerance: 3

# How many simultaneous connections an IP address can make to the server. (Default: 16)
multiclient_limit: 16

# Maximum number of characters an OOC message can contain
max_chars: 256
# Maximum number of characters an IC message can contain
max_chars_ic: 256

# Set up a Discord Bridge bot that keeps track of user messages on both ends (AO2 and Discord).
bridgebot:
  enabled: false # Whether this bot is enabled
  token: string1234 # Discord Token for the bot
  channel: ao2-lobby # channel to set up a bridge with
  character: Ponco # character folder for Bridgebot to use
  emote: normal # idle emote for Bridgebot to use
  pos: jur # position Bridgebot will use when talking
  base_url: http://www.example.com/base/ # base folder URL to seek for bridgebot to get stuff like character avatar graphics etc.
  embed_emotes: False # whether to embed emotes into the message (supports everything defined in extensions.json)
  hub_id: 0 # numeric Hub ID where Bridgebot will reside
  area_id: 0 # numeric Area ID where Bridgebot will talk
  prefix: "}}}[√Dis√] {" # prefix to use before in-character message, usually to identify this message as Bridgebot one
  tickspeed: 0.25 # how often does the Discord Bridge send the IC message piles to Discord in seconds. Cannot be lower than 0.1 (one tenth of a second)
  ooc_chat: true
  ooc_system: true
  announce_channel:
  announce_color: 12745742
  announce_title: Something is being hosted
  announce_image:
  announce_description: "is hosting something"
  announce_ping: false
  announce_role:

# Whether Discord webhooks are enabled, and if they are, the webhook URL to use.
# If webhooks_enabled is set to false, no webhooks will function regardless of whether they are enabled or not.
webhooks_enabled: false
webhook_url: example.com

# Settings for the modcall webhook. Leaving a setting blank will use its default behavior.
modcall_webhook:
  enabled: true
  username: Modcall # the username the webhook will use
  avatar_url: # url of a custom avatar image, leave blank to use the avatar the webhook was set up with
  ping_on_no_mods: false # whether to ping mods if a modcall is received while no moderators are online
  mod_role_id: # the role ID of the role you want pinged. leave blank to use @here instead

kick_webhook:
  enabled: true
  username: Kick
  avatar_url:

ban_webhook: # fires on both regular and HDID bans
  enabled: true
  username: Ban
  avatar_url:

unban_webhook:
  enabled: true
  username: Unban
  avatar_url:

login_webhook:
  enabled: true
  username: Login
  avatar_url:

need_webhook:
  enabled: true
  delay: 60
  username: Need
  avatar_url:
  color: "12745742"  
  pingoption: false
  role_id:
  title: "AO NEED CALL"  
  message: "A user has used the /need command for players in the Attorney Online server!"  
  url:

doorman_webhook:
  hub_id: 0 # numeric Hub ID where doormen will be needed
  area_id: 0 # numeric Area ID where doormen will be needed
  enabled: true
  delay: 120
  username: Doorman
  avatar_url:
  color: "12745742"  
  pingoption: true
  role_id:
  title: "DOORMAN REQUESTED"
  message: "A user is alone and has no one to talk to!"
  url: #webhook url

# DEPRECATED -- the standalone admin panel has been folded into gm_panel (below).
# Do NOT host admin_panel and gm_panel separately: enable gm_panel and give an
# admin-role user a username/password (see gm_panel.users) to get the log viewer
# and admin console. Kept only for backward compatibility.
# Admin panel for viewing server logs in a web browser.
# Logs are organized by hub/area and can be viewed live.
admin_panel:
  enabled: false
  port: 27017
  host: "0.0.0.0"
  users:
    # username: password
    admin: changeme

  # SSL: Option A - Self-signed or custom certificate (serves HTTPS directly)
  # Generate a self-signed cert:
  #   openssl req -x509 -newkey rsa:2048 -keyout config/admin_key.pem -out config/admin_cert.pem -days 3650 -nodes
  ssl_cert:  # e.g. "config/admin_cert.pem"
  ssl_key:   # e.g. "config/admin_key.pem"

  # SSL: Option B - Let's Encrypt via Caddy reverse proxy (requires a domain)
  # Set up a DNS A record pointing to this server, then create a Caddyfile:
  #   admin.yourserver.com {
  #       reverse_proxy localhost:27017
  #   }
  # Then run: caddy run
  domain:  # e.g. "admin.yourserver.com"

  # Rate limiting for login attempts
  rate_limit:
    max_attempts: 5        # Max failed login attempts before lockout
    window_seconds: 300    # Time window in seconds (5 minutes)
    lockout_seconds: 300   # Lockout duration in seconds (5 minutes)

# GM Control Panel: the single web panel -- it doubles as the admin panel.
# Lets an in-game GM micromanage their hub from a browser (areas as a graph,
# who's present, characters, GM-scoped OOC commands, and the Automation Demos
# system), and gives admin-role users the server log viewer + admin console.
#
# admin_panel (above) is deprecated: do NOT host admin_panel and gm_panel
# separately -- enable this panel and configure `users` below instead.
#
# GMs bind the panel to their live client by running /gmpanel in-game, which
# mints a one-time login link. Optionally, standing usernames/passwords (the
# `users` block below) let an admin or GM log in remotely with no live client.
# GMs never see ipid/hdid/IP -- that stays moderator-only (admin-role logins only).
gm_panel:
  enabled: false
  port: 27018
  host: "0.0.0.0"
  session_ttl_seconds: 28800        # 8h, matches admin_panel's cookie lifetime
  login_token_ttl_seconds: 60       # one-time /gmpanel link expires fast
  login_hub_ttl_seconds: 300        # time a gm login may sit on the hub picker
  users:
    # username:
    #   password: changeme
    #   role: admin            # admin (log viewer + console) | gm (GM tabs only)
    #   hubs: [0, 2]           # gm only: hub IDs this account may GM; omit = all hubs

  # Optional: point this at a static image host mirroring your backgrounds/
  # folder (e.g. "https://assets.example.com/backgrounds/") so the Areas tab
  # can render real background thumbnails. Leave blank for a safe default
  # (a text-label placeholder tile) that needs no extra asset pipeline.
  # Reported alongside the top-level `asset_url` (above) via
  # GET /api/gm/assets/config for the panel's local-content resolver.
  background_thumb_base_url:

  # SSL: Option A - Self-signed or custom certificate (serves HTTPS directly)
  # Generate a self-signed cert:
  #   openssl req -x509 -newkey rsa:2048 -keyout config/gm_key.pem -out config/gm_cert.pem -days 3650 -nodes
  ssl_cert:  # e.g. "config/gm_cert.pem"
  ssl_key:   # e.g. "config/gm_key.pem"

  # SSL: Option B - Let's Encrypt via Caddy reverse proxy (requires a domain)
  # Set up a DNS A record pointing to this server, then create a Caddyfile:
  #   gm.yourserver.com {
  #       reverse_proxy localhost:27018
  #   }
  # Then run: caddy run
  domain:  # e.g. "gm.yourserver.com"

  # Rate limiting is not needed for login (there's no password to brute
  # force -- one-time tokens are high-entropy and single-use), but is kept
  # here for parity/documentation with admin_panel's shape.
  rate_limit:
    max_attempts: 10
    window_seconds: 300
    lockout_seconds: 300
