[project]
name = "kfo-server"
version = "3.3.0"
description = "KFO-Server is the official Python-based server for Attorney Online, forked from tsuserver3."
readme = "README.md"
license = { file = "LICENSE.md" }
requires-python = ">=3.11"
dependencies = [
    "aiohttp==3.13.2",
    "aiosignal==1.4.0",
    "arrow==1.3.0",
    "async-timeout==4.0.3",
    "attrs==23.1.0",
    "certifi==2023.7.22",
    "charset-normalizer==3.3.2",
    "discord.py==2.5.2",
    "frozenlist==1.6.0",
    "geoip2==4.7.0",
    "idna==3.4",
    "maxminddb==2.5.1",
    "multidict==6.4.3",
    "oyaml==1.0",
    "pystun3==1.0.0",
    "python-dateutil==2.8.2",
    "PyYAML==6.0.1",
    "requests==2.31.0",
    "six==1.16.0",
    "timeparse-plus==1.2.0",
    "types-python-dateutil==2.8.19.14",
    "urllib3==2.1.0",
    "websockets==12.0",
    "yarl==1.20.0",
]

[dependency-groups]
dev = [
    "pytest",
    "black",
    "tox>=4.21",
    "tox-uv>=1",
]

[tool.uv]
package = false

[tool.black]
line-length = 120
target-version = ["py311"]
# You can add patterns here if you need to exclude generated files, etc.
# extend-exclude = []

[tool.tox]
requires = ["tox>=4.21", "tox-uv>=1"]
env_list = ["py311"]
skip_missing_interpreters = true

[tool.tox.env_run_base]
runner = "uv-venv-lock-runner"
package = "skip"
dependency_groups = ["dev"]
set_env = { PYTHONPATH = "{toxinidir}" }
commands = [["pytest", "-q"]]
